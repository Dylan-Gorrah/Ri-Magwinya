<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1">
<meta name="theme-color" content="#0D1F3D">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>Ri-magwinya</title>
<!--
  Ri-magwinya on the web.

  The same app as the Android build, talking to the same Supabase project:
  the same accounts, the same menu, the same orders. Built so the whole
  thing can be demonstrated from a phone browser.

  The styling is the Part 1 prototype's, unchanged, because that was the
  design source of truth the Android app was built from.

  Reference: Supabase. 2026. REST API. [Online].
  Available at: <https://supabase.com/docs/guides/api> [Accessed 22 September 2026].
  AI assistance: Anthropic. 2026. Claude [Large language model].
  Available at: https://claude.ai [Accessed 22 September 2026].
  Used to: write this web build from the existing Android app and prototype.
-->
<style>

/* ==========================================================
   TOKENS
   ========================================================== */
:root{
  /* page */
  --page:#EEF2F7;
  --page-ink:#0F1B2E;
  --page-2:#5A6779;
  --rule:rgba(15,27,46,.12);

  /* app surface — premium silver white */
  --bg:#F2F5F9;
  --surface:#FFFFFF;
  --surface-2:#E9EEF5;
  --text:#0F1B2E;
  --text-2:#5A6779;
  --text-3:#93A0B0;
  --border:rgba(15,27,46,.08);
  --border-2:rgba(15,27,46,.16);

  /* brand */
  --navy:#16305B;
  --navy-deep:#0D1F3D;
  --on-navy:#FFFFFF;
  --sky:#3E7FBF;
  --sky-soft:#9EC6E8;
  --sky-wash:#E8F1FA;
  --gold:#B8892C;
  --gold-wash:#FAF2E3;
  --dough:#E9A84F;

  /* semantic */
  --ok:#2A7050;   --ok-wash:#E6F1EC;
  --warn:#9A6B12; --warn-wash:#FAF2E3;
  --err:#A33A2E;  --err-wash:#F8EBE9;

  /* radius */
  --r-xs:8px; --r-s:12px; --r-m:16px; --r-l:20px; --r-phone:44px;

  /* motion */
  --fast:180ms; --norm:300ms; --slow:460ms;
  --ease:cubic-bezier(.22,.61,.36,1);
  --spring:cubic-bezier(.34,1.56,.64,1);

  /* depth */
  --lift-1:0 1px 2px rgba(15,27,46,.05);
  --lift-2:0 6px 20px rgba(15,27,46,.07);
  --lift-3:0 24px 64px rgba(15,27,46,.16), 0 2px 8px rgba(15,27,46,.05);
}
.screen.dark{
  --bg:#0B1220;
  --surface:#141C2B;
  --surface-2:#1E2739;
  --text:#EEF2F7;
  --text-2:#95A2B4;
  --text-3:#68758A;
  --border:rgba(255,255,255,.09);
  --border-2:rgba(255,255,255,.18);

  --navy:#2F5C9E;
  --navy-deep:#1B3A6B;
  --on-navy:#F4F8FC;
  --sky:#7FB3E0;
  --sky-wash:rgba(127,179,224,.13);
  --gold:#D9AC55;
  --gold-wash:rgba(217,172,85,.13);

  --ok:#5FBD8C;   --ok-wash:rgba(95,189,140,.14);
  --warn:#D9AC55; --warn-wash:rgba(217,172,85,.14);
  --err:#E08476;  --err-wash:rgba(224,132,118,.14);
}

*,*::before,*::after{box-sizing:border-box}
html,body{height:100%}
html{-webkit-text-size-adjust:100%}
body{
  margin:0;background:var(--page);color:var(--page-ink);
  font-family:Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
  font-size:16px;line-height:1.55;-webkit-font-smoothing:antialiased;overflow:hidden;
}
button{font:inherit;color:inherit;border:0;background:none;padding:0;cursor:pointer;-webkit-tap-highlight-color:transparent}
input{font:inherit}
:focus-visible{outline:2px solid var(--sky);outline-offset:2px}

/* ==========================================================
   STAGE
   ========================================================== */
.stage{position:relative;height:100%;display:grid;grid-template-columns:minmax(300px,384px) 1fr}
.brief{height:100%;overflow-y:auto;padding:44px 34px;border-right:1px solid var(--rule)}
.brand-row{display:flex;align-items:center;gap:14px;margin-bottom:22px}
.brief h1{font-size:26px;font-weight:600;letter-spacing:-.03em;line-height:1.15;margin:0}
.brief h1 span{display:block;font-size:12px;font-weight:500;letter-spacing:.14em;text-transform:uppercase;color:var(--page-2);margin-top:5px}
.brief p.lead{font-size:14px;line-height:1.62;color:var(--page-2);margin:0 0 26px}
.brief h2{font-size:10px;letter-spacing:.14em;text-transform:uppercase;font-weight:600;color:var(--text-3);margin:0 0 12px;padding-top:22px;border-top:1px solid var(--rule)}
.cred{border:1px solid var(--rule);border-radius:12px;background:rgba(255,255,255,.6);padding:12px 14px;margin-bottom:8px;width:100%;text-align:left;display:block;transition:transform var(--fast) var(--spring),border-color var(--fast) var(--ease)}
.cred:hover{border-color:var(--sky)}
.cred:active{transform:scale(.98)}
.cred b{display:block;font-size:13px;font-weight:600;margin-bottom:3px}
.cred span{display:block;font-size:11.5px;color:var(--page-2)}
.steps{margin:0;padding-left:18px;font-size:13px;line-height:1.72;color:var(--page-2)}
.steps li{margin-bottom:6px}
.steps b{color:var(--page-ink);font-weight:600}
.brief-actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:16px}
.tbtn{font-size:12.5px;font-weight:500;padding:9px 15px;min-height:40px;border:1px solid var(--rule);border-radius:10px;background:rgba(255,255,255,.6);display:inline-flex;align-items:center;gap:7px;transition:transform var(--fast) var(--spring)}
.tbtn:active{transform:scale(.96)}
.tbtn.solid{background:var(--navy);color:#fff;border-color:var(--navy)}
.device{display:grid;place-items:center;height:100%;padding:24px}
.mobilebar{display:none}

/* ==========================================================
   PHONE
   ========================================================== */
.phone{width:378px;background:#0B1220;border-radius:var(--r-phone);padding:10px;box-shadow:var(--lift-3);flex:none}
.screen{position:relative;background:var(--bg);border-radius:35px;overflow:hidden;
  height:min(788px,calc(100vh - 68px));display:flex;flex-direction:column;font-size:14px;color:var(--text);
  transition:background var(--norm) var(--ease),color var(--norm) var(--ease)}
.statusbar{flex:none;height:38px;display:flex;align-items:center;justify-content:space-between;padding:0 24px;font-size:11.5px;font-weight:600;color:var(--text)}
.statusbar.inv{color:#fff}
.sb-icons{display:flex;align-items:center;gap:5px}
#app{flex:1;min-height:0;display:flex;flex-direction:column}
.homebar{flex:none;height:22px;display:flex;align-items:center;justify-content:center}
.homebar span{width:112px;height:4px;border-radius:2px;background:var(--border-2)}

@media (max-width:899px){
  body{overflow:auto}
  .stage{display:block;height:auto}
  .brief{display:none}
  .device{padding:0;height:auto;display:block}
  .mobilebar{display:flex;align-items:center;gap:10px;height:48px;padding:0 14px;border-bottom:1px solid var(--rule);
    position:sticky;top:0;z-index:60;background:rgba(238,242,247,.9);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px)}
  .mobilebar .mb-t{flex:1;font-size:12px;font-weight:600;color:var(--page-2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .mobilebar .tbtn{min-height:34px;padding:6px 11px;font-size:11.5px}
  .phone{width:100%;padding:0;border-radius:0;box-shadow:none;background:transparent}
  .screen{border-radius:0;height:calc(100dvh - 48px)}
  .statusbar{display:none}
  .homebar{height:max(12px,env(safe-area-inset-bottom,0px))}
  .homebar span{display:none}
}

/* ==========================================================
   APP PRIMITIVES
   ========================================================== */
.view{flex:1;min-height:0;display:flex;flex-direction:column;animation:enter var(--norm) var(--ease)}
@keyframes enter{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
.scroll{flex:1;min-height:0;overflow-y:auto;overscroll-behavior:contain;padding:0 20px 24px;-webkit-overflow-scrolling:touch}
.scroll::-webkit-scrollbar{width:0}

.appbar{flex:none;padding:6px 20px 16px;display:flex;align-items:center;gap:11px}
.appbar h3{font-size:20px;font-weight:600;letter-spacing:-.025em;margin:0;flex:1;min-width:0}
.iconbtn{width:40px;height:40px;flex:none;display:grid;place-items:center;border-radius:11px;
  border:1px solid var(--border);background:var(--surface);color:var(--text);position:relative;
  transition:transform var(--fast) var(--spring)}
.iconbtn:active{transform:scale(.93)}
.iconbtn.ghost{border-color:transparent;background:transparent}
.iconbtn .nb{position:absolute;top:-3px;right:-3px;min-width:17px;height:17px;border-radius:9px;background:var(--err);
  color:#fff;font-size:9.5px;font-weight:600;display:grid;place-items:center;padding:0 4px;border:2px solid var(--bg)}

.tabbar{flex:none;display:grid;grid-template-columns:repeat(4,1fr);border-top:1px solid var(--border);
  background:color-mix(in srgb, var(--surface) 88%, transparent);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);padding:7px 6px 3px}
.tab{display:flex;flex-direction:column;align-items:center;gap:4px;font-size:10px;font-weight:500;color:var(--text-3);
  min-height:46px;justify-content:center;position:relative;transition:color var(--fast) var(--ease),transform var(--fast) var(--spring)}
.tab.active{color:var(--navy)}
.tab:active{transform:scale(.93)}
.tab .badge{position:absolute;top:1px;left:calc(50% + 6px);min-width:16px;height:16px;border-radius:8px;background:var(--err);
  color:#fff;font-size:9.5px;font-weight:600;display:grid;place-items:center;padding:0 4px}

.h-lg{font-size:27px;font-weight:600;letter-spacing:-.03em;line-height:1.18;margin:0}
.h-md{font-size:15px;font-weight:600;letter-spacing:-.015em;margin:0}
.sub{font-size:13.5px;color:var(--text-2);line-height:1.5;margin:0}
.tiny{font-size:11.5px;color:var(--text-3);margin:0;line-height:1.45}
.label{font-size:10.5px;letter-spacing:.12em;text-transform:uppercase;font-weight:600;color:var(--text-3);margin:0 0 10px}
.row{display:flex;align-items:center;gap:12px}
.row.between{justify-content:space-between}
.grow{flex:1;min-width:0}
.trunc{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.sp8{height:8px}.sp12{height:12px}.sp16{height:16px}.sp20{height:20px}.sp24{height:24px}.sp32{height:32px}.sp40{height:40px}

.field{border:1px solid var(--border);background:var(--surface);border-radius:var(--r-s);padding:0 14px;
  display:flex;align-items:center;gap:10px;min-height:50px;
  transition:border-color var(--fast) var(--ease),box-shadow var(--fast) var(--ease)}
.field:focus-within{border-color:var(--sky);box-shadow:0 0 0 3px var(--sky-wash)}
.field.bad{border-color:var(--err);box-shadow:0 0 0 3px var(--err-wash)}
.field input{flex:1;min-width:0;border:0;background:transparent;outline:0;font-size:14.5px;color:var(--text);padding:13px 0}
.field input::placeholder{color:var(--text-3)}
.field-lab{font-size:11.5px;font-weight:600;color:var(--text-2);margin:0 0 6px}
.err-txt{font-size:11.5px;color:var(--err);margin:6px 0 0;display:flex;align-items:center;gap:5px;min-height:16px}

.btn{display:flex;align-items:center;justify-content:center;gap:8px;min-height:52px;border-radius:var(--r-s);
  font-size:14.5px;font-weight:600;background:var(--navy);color:var(--on-navy);width:100%;
  box-shadow:var(--lift-1);transition:transform var(--fast) var(--spring)}
.btn:active{transform:scale(.975)}
.btn.secondary{background:var(--surface);color:var(--text);border:1px solid var(--border-2);box-shadow:none}
.btn.quiet{background:transparent;color:var(--sky);box-shadow:none;min-height:46px;font-weight:500}
.btn.danger{background:transparent;color:var(--err);border:1px solid var(--err);box-shadow:none}
.btn.sm{min-height:40px;font-size:12.5px;border-radius:10px;width:auto;padding:0 15px}
.btn[disabled]{background:var(--surface-2);color:var(--text-3);box-shadow:none;pointer-events:none;border:1px solid var(--border)}

.card{background:var(--surface);border:1px solid var(--border);border-radius:var(--r-m);padding:16px}
.list{background:var(--surface);border:1px solid var(--border);border-radius:var(--r-m);overflow:hidden}
.list-row{display:flex;align-items:center;gap:12px;padding:12px 14px;min-height:58px;width:100%;text-align:left}
.list-row+.list-row{border-top:1px solid var(--border)}
button.list-row{transition:background var(--fast) var(--ease)}
button.list-row:active{background:var(--surface-2)}

.pill{display:inline-flex;align-items:center;gap:5px;font-size:10.5px;font-weight:600;padding:4px 9px;border-radius:6px;
  background:var(--surface-2);color:var(--text-2);white-space:nowrap}
.pill.ok{background:var(--ok-wash);color:var(--ok)}
.pill.warn{background:var(--warn-wash);color:var(--warn)}
.pill.err{background:var(--err-wash);color:var(--err)}
.pill.sky{background:var(--sky-wash);color:var(--sky)}
.pill.gold{background:var(--gold-wash);color:var(--gold)}
.dot{width:5px;height:5px;border-radius:3px;background:currentColor;flex:none}

.chips{display:flex;gap:8px;overflow-x:auto;padding-bottom:3px;scrollbar-width:none}
.chips::-webkit-scrollbar{height:0}
.chip{flex:none;font-size:12.5px;font-weight:500;padding:0 15px;min-height:38px;display:flex;align-items:center;
  border-radius:10px;border:1px solid var(--border);background:var(--surface);color:var(--text-2);white-space:nowrap;
  transition:transform var(--fast) var(--spring),background var(--fast) var(--ease),color var(--fast) var(--ease)}
.chip:active{transform:scale(.95)}
.chip.on{background:var(--navy);border-color:var(--navy);color:var(--on-navy)}

.thumb{width:52px;height:52px;flex:none;border-radius:13px;background:var(--sky-wash);display:grid;place-items:center;color:var(--navy)}
.thumb.sm{width:36px;height:36px;border-radius:10px}
.thumb.lg{width:62px;height:62px;border-radius:16px}
.thumb.muted{background:var(--surface-2);color:var(--text-3)}
.price{font-size:14px;font-weight:600;font-variant-numeric:tabular-nums;white-space:nowrap}
.dim{opacity:.42}

.stepper{display:flex;align-items:center;gap:2px;border:1px solid var(--border);border-radius:10px;background:var(--surface);padding:2px;flex:none}
.stepper button{width:34px;height:34px;display:grid;place-items:center;border-radius:8px;color:var(--text);
  transition:background var(--fast) var(--ease),transform var(--fast) var(--spring)}
.stepper button:active{transform:scale(.9);background:var(--surface-2)}
.stepper .n{min-width:28px;text-align:center;font-size:13.5px;font-weight:600;font-variant-numeric:tabular-nums}

.toggle{width:46px;height:27px;border-radius:14px;background:var(--navy);position:relative;flex:none;transition:background var(--norm) var(--ease)}
.toggle.off{background:var(--border-2)}
.toggle::after{content:"";position:absolute;top:3px;left:22px;width:21px;height:21px;border-radius:11px;background:#fff;
  box-shadow:var(--lift-1);transition:left var(--norm) var(--spring)}
.toggle.off::after{left:3px}

.banner{border-radius:var(--r-s);padding:12px 14px;display:flex;gap:10px;align-items:flex-start;font-size:12.5px;line-height:1.52}
.banner.sky{background:var(--sky-wash);color:var(--sky)}
.banner.warn{background:var(--warn-wash);color:var(--warn)}
.banner.err{background:var(--err-wash);color:var(--err)}
.banner.ok{background:var(--ok-wash);color:var(--ok)}

.hero{background:var(--navy-deep);color:#fff;margin:0 -20px;padding:4px 20px 22px}
.hero .tiny{color:rgba(255,255,255,.62)}
.hero .h-lg{color:#fff}

.rolecard{width:100%;text-align:left;background:var(--surface);border:1px solid var(--border);border-radius:var(--r-m);
  padding:18px;display:flex;gap:14px;align-items:center;transition:transform var(--fast) var(--spring),border-color var(--fast) var(--ease)}
.rolecard:active{transform:scale(.98)}
.rolecard:hover{border-color:var(--sky)}

.rail{position:relative;padding-left:26px}
.rail-step{position:relative;padding-bottom:20px}
.rail-step:last-child{padding-bottom:0}
.rail-step::before{content:"";position:absolute;left:-26px;top:3px;width:14px;height:14px;border-radius:8px;
  border:2px solid var(--border-2);background:var(--surface);transition:background var(--norm) var(--ease)}
.rail-step::after{content:"";position:absolute;left:-20px;top:19px;width:2px;height:calc(100% - 18px);background:var(--border)}
.rail-step:last-child::after{display:none}
.rail-step.done::before{background:var(--ok);border-color:var(--ok)}
.rail-step.done::after{background:var(--ok)}
.rail-step.now::before{background:var(--navy);border-color:var(--navy);box-shadow:0 0 0 4px var(--sky-wash)}
.rail-t{font-size:13.5px;font-weight:600;margin:0}
.rail-s{font-size:11.5px;color:var(--text-3);margin:2px 0 0}

.code{display:flex;gap:8px;justify-content:center}
.code span{width:46px;height:58px;display:grid;place-items:center;border-radius:12px;background:var(--navy);
  color:var(--on-navy);font-size:25px;font-weight:600;font-variant-numeric:tabular-nums;
  animation:pop var(--slow) var(--spring) backwards}
.code span:nth-child(2){animation-delay:60ms}
.code span:nth-child(3){animation-delay:120ms}
.code span:nth-child(4){animation-delay:180ms}
@keyframes pop{from{opacity:0;transform:scale(.7)}to{opacity:1;transform:none}}

.bars{display:flex;align-items:flex-end;gap:6px;height:110px}
.bars .b{flex:1;background:var(--sky-wash);border-radius:5px 5px 2px 2px;min-height:3px}
.bars .b.peak{background:var(--navy)}
.bar-x{display:flex;gap:6px;margin-top:8px}
.bar-x span{flex:1;text-align:center;font-size:9px;color:var(--text-3)}
.stat-n{font-size:23px;font-weight:600;letter-spacing:-.03em;margin:2px 0 0;font-variant-numeric:tabular-nums}

.empty{text-align:center;padding:56px 24px}
.empty .thumb{margin:0 auto 16px;width:64px;height:64px;border-radius:18px}

.opt{display:flex;align-items:center;gap:12px;padding:12px 14px;min-height:54px;width:100%;text-align:left;
  transition:background var(--fast) var(--ease)}
.opt+.opt{border-top:1px solid var(--border)}
.opt:active{background:var(--surface-2)}
.radio{width:22px;height:22px;border-radius:12px;border:1.5px solid var(--border-2);flex:none;display:grid;place-items:center}
.radio.on{border-color:var(--navy);background:var(--navy)}
.radio.on::after{content:"";width:8px;height:8px;border-radius:4px;background:#fff}
.check{width:22px;height:22px;border-radius:7px;border:1.5px solid var(--border-2);flex:none;display:grid;place-items:center;color:#fff}
.check.on{border-color:var(--navy);background:var(--navy)}

.scrim{position:absolute;inset:0;background:rgba(9,17,32,.44);z-index:70;opacity:0;
  transition:opacity var(--norm) var(--ease);backdrop-filter:blur(2px);-webkit-backdrop-filter:blur(2px)}
.scrim.on{opacity:1}
.sheet{position:absolute;left:0;right:0;bottom:0;z-index:71;background:var(--surface);border-radius:26px 26px 0 0;
  padding:10px 20px calc(22px + env(safe-area-inset-bottom,0px));transform:translateY(102%);
  transition:transform var(--norm) var(--spring);max-height:86%;overflow-y:auto;box-shadow:0 -14px 44px rgba(9,17,32,.16)}
.sheet.on{transform:none}
.grab{width:38px;height:4px;border-radius:2px;background:var(--border-2);margin:0 auto 16px}

.toast{position:absolute;left:16px;right:16px;top:46px;z-index:80;background:rgba(13,31,61,.95);color:#fff;
  border-radius:14px;padding:13px 15px;display:flex;align-items:center;gap:11px;font-size:13px;line-height:1.4;
  box-shadow:var(--lift-2);opacity:0;transform:translateY(-14px);
  transition:opacity var(--norm) var(--ease),transform var(--norm) var(--spring);
  backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);pointer-events:none}
.toast.on{opacity:1;transform:none}
.toast .tk{width:26px;height:26px;border-radius:8px;background:rgba(255,255,255,.16);display:grid;place-items:center;flex:none}

@media (prefers-reduced-motion:reduce){*{animation-duration:.001ms!important;transition-duration:.001ms!important}}

/* ==========================================================
   WEB BUILD — fill the phone instead of sitting in a mock frame
   ========================================================== */
html, body { height: 100%; margin: 0; background: var(--bg); }
body {
  font-family: "Inter", -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif;
  -webkit-font-smoothing: antialiased;
  overscroll-behavior-y: none;
}
#screen {
  position: fixed; inset: 0;
  display: flex; flex-direction: column;
  background: var(--bg); color: var(--text);
  /* Notch and home indicator on an iPhone. */
  padding: env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);
  overflow: hidden;
}
#screen.dark {
  --bg:#0B1220; --surface:#141C2B; --surface-2:#1E2739;
  --text:#EEF2F7; --text-2:#95A2B4; --text-3:#68758A;
  --border:rgba(255,255,255,.09); --border-2:rgba(255,255,255,.18);
  --navy:#2F5C9E; --navy-deep:#1B3A6B; --sky:#7FB3E0; --sky-wash:rgba(126,179,224,.13);
  --gold:#D9AC55; --gold-wash:rgba(217,172,85,.13);
  --ok:#5FBD8C; --ok-wash:rgba(95,189,140,.13);
  --warn:#D9AC55; --warn-wash:rgba(217,172,85,.13);
  --err:#E08476; --err-wash:rgba(224,132,118,.13);
}
#app { flex: 1; min-height: 0; display: flex; flex-direction: column; }
.scroll { padding-bottom: 32px; }
/* The hero runs to the top edge, under the status bar. */
.hero { padding-top: 18px; }
button { font-family: inherit; }
/* A tap must never select text or flash blue. */
* { -webkit-tap-highlight-color: transparent; }
input, textarea { -webkit-user-select: text; user-select: text; }
.offline-bar {
  flex: none; background: var(--warn-wash); color: var(--warn);
  font-size: 12px; font-weight: 600; padding: 7px 20px; text-align: center;
}
.spin { animation: spin 900ms linear infinite; display: inline-block; }
@keyframes spin { to { transform: rotate(360deg); } }
</style>
</head>
