# Build and test on every push.
#
# The point is that a broken build or a failing test is caught here rather
# than on a phone the night before a demo.
#
# Reference: GitHub. 2026. Building and testing Java with Gradle. [Online].
# Available at: <https://docs.github.com/en/actions/use-cases-and-examples/building-and-testing/building-and-testing-java-with-gradle>
# [Accessed 22 September 2026].
name: Build

on:
  push:
    branches: [main]
    # A tag like v1.0.0 also publishes the APK to Releases.
    tags: ['v*']
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest

    # Needed by the release step to attach the APK. Read-only otherwise.
    permissions:
      contents: write

    # Read by app/build.gradle.kts when local.properties is absent, which it
    # always is here — it is gitignored. Empty secrets are fine: the app
    # builds with empty keys and simply cannot reach the server.
    env:
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}

    steps:
      - name: Check out the code
        uses: actions/checkout@v5

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v5

      # Git does not carry the executable bit from Windows, where this repo
      # is developed, so the runner needs it set.
      - name: Make gradlew executable
        run: chmod +x ./gradlew

      - name: Unit tests
        run: ./gradlew testDebugUnitTest --no-daemon

      - name: Build debug APK
        run: ./gradlew assembleDebug --no-daemon

      # A name a person can recognise in their Downloads folder, rather than
      # app-debug.apk. The version comes from build.gradle.kts, so it cannot
      # drift from what the app reports about itself.
      - name: Name the APK
        id: apk
        run: |
          VERSION=$(grep -oP 'versionName = "\K[^"]+' app/build.gradle.kts)
          NAME="Ri-magwinya-v${VERSION}.apk"
          cp app/build/outputs/apk/debug/app-debug.apk "$NAME"
          echo "name=$NAME" >> "$GITHUB_OUTPUT"
          echo "Built $NAME"

      - name: Upload the APK
        uses: actions/upload-artifact@v4
        with:
          name: Ri-magwinya-apk
          path: ${{ steps.apk.outputs.name }}
          if-no-files-found: error

      # Pushing a tag publishes the APK on the repo's Releases page, where
      # anyone can download it without a GitHub account. Uses the token
      # GitHub provides to every run, so there is no secret to set up.
      - name: Publish to Releases
        if: ${{ startsWith(github.ref, 'refs/tags/v') }}
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ steps.apk.outputs.name }}
          generate_release_notes: true
          body: |
            Ri-magwinya, built by GitHub Actions from this tag.

            **Installing it:** download the .apk on an Android phone, open
            it, and allow installing from this source when asked. Android 7
            (2016) and newer. It is signed with the standard debug key, so
            it installs by sideloading rather than through the Play Store.

      - name: Upload test reports
        # Uploaded even when the tests fail — that is when they are wanted.
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: app/build/reports/tests/testDebugUnitTest
          if-no-files-found: ignore
